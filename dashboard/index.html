<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TFK Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M12 9l11 7-11 7z' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f6fa; --card:#fff; --ink:#161a2b; --muted:#667085; --line:#e5e7ee; --brand:#4f46e5; --brand-ink:#fff;
  --ok:#0f9d6b; --warn:#c77700; --bad:#d93a3a; --info:#2563eb; --chip:#eef0f7;
  --yt:#e5322d; --fb:#1877f2; --ig:#c13584; --tg:#229ed9; --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){:root{--bg:#0e1220;--card:#171c2e;--ink:#eceef6;--muted:#97a0b8;--line:#272d44;--brand:#7c78ff;--chip:#222842;--shadow:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px}
.brand i{width:28px;height:28px;border-radius:8px;background:var(--brand);display:grid;place-items:center}
.brand i:after{content:"";border-left:10px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:3px}
nav{display:flex;gap:4px}
nav button{border:0;background:none;padding:8px 14px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600;position:relative}
nav button.on{background:var(--chip);color:var(--ink)}
nav .badge{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:1px 6px;margin-left:6px}
.sp{flex:1}
.conn{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
.wrap{max-width:1280px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
@media(max-width:980px){.grid{grid-template-columns:1fr}.side{order:-1;position:static!important}}
.side{position:sticky;top:70px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:16px}
.card h3{margin:16px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:24px;line-height:1.2}.kpi span{color:var(--muted);font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.bad{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:8px}
input[type=text],input[type=password],input[type=number],textarea,select{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
textarea{min-height:70px;resize:vertical}
label.f{display:block;margin:10px 0 4px;font-size:13px;font-weight:600}
.hint{font-size:12px;color:var(--muted);margin-top:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--chip);border-radius:99px;padding:2px 10px;font-size:12px;display:inline-flex;gap:5px;align-items:center}
.chip.ok{color:var(--ok)}.chip.bad{color:var(--bad)}.chip.warn{color:var(--warn)}.chip.info{color:var(--info)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-size:12px;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:var(--chip)}
.tw{overflow-x:auto}
.st{font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--chip)}
.st.published{color:var(--ok)}.st.failed,.st.rejected{color:var(--bad)}.st.review{color:var(--warn)}.st.rendering,.st.pending,.st.writing,.st.publishing,.st.uploading{color:var(--info)}
.bar{height:10px;background:var(--chip);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--brand);transition:width .4s}
.steps{display:flex;gap:6px;margin:10px 0}
.steps div{flex:1;text-align:center;font-size:12px;padding:6px 2px;border-radius:8px;background:var(--chip);color:var(--muted)}
.steps div.on{background:var(--brand);color:#fff}.steps div.done{color:var(--ok)}
.ev{max-height:260px;overflow:auto;font-size:13px;border-top:1px solid var(--line);margin-top:10px;padding-top:6px}
.ev div{padding:3px 0;display:flex;gap:8px}.ev time{color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
video{width:100%;max-height:360px;background:#000;border-radius:10px;margin-top:10px}
.alert{border-left:4px solid var(--info);background:var(--chip);border-radius:10px;padding:10px 12px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start}
.alert.high{border-color:var(--bad)}.alert.medium{border-color:var(--warn)}.alert.low{border-color:var(--info)}
.alert .t{font-weight:700}.alert .d{color:var(--muted);font-size:13px;margin-top:2px;word-break:break-word}
.lg{font-size:13px}.lg td{padding:6px 8px}
.lv{font-weight:700;font-size:11px;text-transform:uppercase}.lv.error{color:var(--bad)}.lv.warn{color:var(--warn)}.lv.info{color:var(--muted)}
.set{display:grid;grid-template-columns:1fr;gap:4px;padding:10px 0;border-bottom:1px solid var(--line)}
.set:last-child{border:0}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:700px){.cols2{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:50;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.login{max-width:440px;margin:12vh auto;padding:0 16px}
.empty{color:var(--muted);padding:12px 0;font-size:14px}
.rec li{margin:6px 0}
svg text{fill:var(--muted);font-size:11px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap;margin:6px 0}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const DEFAULT_API = "https://faceless-video.faceless-video.workers.dev";
const DEMO = new URLSearchParams(location.search).has("demo");
const LS = { get(k){ try{return localStorage.getItem(k)}catch{return null} }, set(k,v){ try{localStorage.setItem(k,v)}catch{} }, del(k){ try{localStorage.removeItem(k)}catch{} } };
const PLAT = { youtube:{n:"YouTube",c:"var(--yt)"}, facebook:{n:"Facebook",c:"var(--fb)"}, instagram:{n:"Instagram",c:"var(--ig)"}, telegram:{n:"Telegram",c:"var(--tg)"} };
const S = { api: LS.get("tfk_api") || DEFAULT_API, token: LS.get("tfk_token") || "", page: "studio", data: null, cfg: null, active: sessionStorage.getItem("tfk_active") || null, activeJob: null, busy: {} };

/* ---------- helpers ---------- */
function el(tag, props, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(props||{})){
    if (k==="class") e.className=v; else if (k==="html") e.innerHTML=v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v===true) e.setAttribute(k,""); else if (v!==false && v!=null) e.setAttribute(k,v);
  }
  for (const k of kids.flat()) if (k!=null && k!==false) e.append(k.nodeType?k:document.createTextNode(String(k)));
  return e;
}
const $ = (s,r=document)=>r.querySelector(s);
const fill = (n,...k)=>n.replaceChildren(...k.flat().filter(Boolean));
const fmt = n => n==null?"–":Number(n).toLocaleString();
const ago = t => { if(!t) return "earlier"; const s=Math.max(0,(Date.now()-t)/1000); if(s<60)return"just now"; if(s<3600)return Math.floor(s/60)+" min ago"; if(s<86400)return Math.floor(s/3600)+" h ago"; return Math.floor(s/86400)+" d ago"; };
const clock = t => new Date(t).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"});
const when = t => !t ? "–" : new Date(t).toLocaleString([], {month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});
function toast(m){ const t=el("div",{class:"toast"},m); document.body.append(t); setTimeout(()=>t.remove(),4200); }
async function api(path, opts={}){
  if (DEMO){
    if (path==="/api/state"||path==="/api/config"){ const r=await fetch(path==="/api/state"?"demo-state.json":"demo-config.json"); if(r.ok) return r.json();
      toast("No demo data is published. Sign in to see your own data."); return path==="/api/state"?{now:Date.now(),jobs:[],stats:null,history:[],health:null,log:[],alerts:[],platforms:{},settings:{crons:{},autoPublishHours:0}}:{items:[]}; }
    toast("Demo mode: actions are disabled"); return {ok:false, error:"demo"};
  }
  const r = await fetch(S.api+path, {...opts, headers:{Authorization:"Bearer "+S.token, ...(opts.body&&!(opts.body instanceof ArrayBuffer||opts.body instanceof Blob)?{"content-type":"application/json"}:{}), ...(opts.headers||{})}});
  if (r.status===401){ logout(true); throw new Error("Not signed in"); }
  const j = await r.json().catch(()=>({})); if (!r.ok && !j.error) j.error="HTTP "+r.status; return j;
}
const post = (p,b) => api(p,{method:"POST",body:JSON.stringify(b||{})});
async function startVideo(topic){ // creates the job, then writes the script in a second, long request while the progress panel polls
  const r=await post("/api/run",{topic}); if(r.ok) post("/api/job/"+r.id+"/generate",{topic}).catch(()=>{}); return r;
}
function logout(msg){ LS.del("tfk_token"); S.token=""; sessionStorage.removeItem("tfk_active"); if(msg) setTimeout(()=>toast("Please sign in again"),50); render(); }

/* ---------- data ---------- */
const jobViews = j => { const st=(S.data?.stats?.videos||{})[j.id]||{}; let views=0,likes=0,comments=0; for(const p of Object.values(st)){views+=p.views||0;likes+=p.likes||0;comments+=p.comments||0} return {st,views,likes,comments}; };
async function refresh(quiet){
  try { S.data = await api("/api/state"); } catch(e){ if(!quiet) toast(e.message); setConn(false); return; }
  setConn(true); drawAll();
  if (S.active) await pollActive();
}
function setConn(ok){ const d=$("#conn"); if(d){ d.firstChild.className="dot "+(ok?"ok":"bad"); d.lastChild.textContent = DEMO?"Demo data":ok?"Connected":"Offline"; } }
async function pollActive(){
  if (!S.active || DEMO) { S.activeJob = S.data?.jobs.find(j=>j.id===S.active)||null; drawProgress(); return; }
  try { const j = await api("/api/job/"+S.active); if (!j.error) S.activeJob = j; } catch{}
  drawProgress();
}
function drawAll(){
  drawBadge(); if (S.page==="studio"){ drawKpis(); drawVideos(); drawInsights(); drawInfo(); drawProgress(); } if (S.page==="alerts") drawAlerts();
}
function drawBadge(){ const n=(S.data?.alerts||[]).filter(a=>a.level!=="low").length; const b=$("#alertBadge"); if(b){ b.textContent=n; b.classList.toggle("hidden",!n);} }

/* ---------- layout ---------- */
function render(){
  const app = $("#app"); app.replaceChildren();
  if (!S.token && !DEMO){ app.append(loginView()); return; }
  app.append(
    el("header",{class:"top"},
      el("div",{class:"brand"},el("i"),"TFK Studio"),
      el("nav",{}, ...[["studio","Studio"],["alerts","Alerts"],["settings","Settings"]].map(([k,n])=>
        el("button",{class:S.page===k?"on":"","data-p":k,onclick:()=>go(k)},n,k==="alerts"?el("span",{class:"badge hidden",id:"alertBadge"}):null))),
      el("div",{class:"sp"}),
      el("div",{class:"conn",id:"conn"},el("span",{class:"dot"}),el("span",{},"Connecting…")),
      el("button",{class:"btn sm",onclick:()=>refresh()},"Refresh"),
      DEMO?null:el("button",{class:"btn sm",onclick:()=>logout()},"Sign out")),
    el("div",{class:"wrap",id:"page"}));
  buildPage(); refresh(true);
}
function go(p){ S.page=p; document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.p===p)); buildPage(); if(p==="settings") loadCfg(); else drawAll(); if(S.data) drawBadge(); }
function buildPage(){ const pg=$("#page"); pg.replaceChildren(S.page==="studio"?studioView():S.page==="alerts"?alertsView():settingsView()); }
function loginView(){
  const url=el("input",{type:"text",value:S.api,autocomplete:"off"}), tok=el("input",{type:"password",autocomplete:"current-password",placeholder:"Paste your admin token"});
  const go=async()=>{ S.api=url.value.trim().replace(/\/$/,""); S.token=tok.value.trim(); if(!S.token) return;
    try{ const r=await fetch(S.api+"/api/state",{headers:{Authorization:"Bearer "+S.token}}); if(r.status===401){toast("That token was not accepted");S.token="";return;} if(!r.ok) throw new Error("HTTP "+r.status);
      LS.set("tfk_api",S.api); LS.set("tfk_token",S.token); render(); }catch(e){ S.token=""; toast("Could not reach the server: "+e.message); } };
  tok.addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
  return el("div",{class:"login"},el("div",{class:"card"},
    el("div",{class:"brand",style:"margin-bottom:10px"},el("i"),"TFK Studio"),
    el("p",{class:"sub"},"Sign in with the admin token (JOB_TOKEN) of your Worker. It is stored only in this browser."),
    el("label",{class:"f"},"Worker address"),url,el("label",{class:"f"},"Admin token"),tok,
    el("div",{class:"row",style:"margin-top:14px"},el("button",{class:"btn pri",onclick:go},"Sign in"),el("a",{href:"?demo=1"},"View demo"))));
}

/* ---------- STUDIO ---------- */
function studioView(){
  const topic=el("input",{type:"text",id:"topic",placeholder:"Optional: a topic, e.g. how volcanoes work"});
  const create=el("button",{class:"btn pri",id:"createBtn",onclick:async()=>{
    create.disabled=true; create.textContent="Starting…";
    const r=await startVideo(topic.value.trim());
    create.disabled=false; create.textContent="Create new video";
    if(r.ok){ S.active=r.id; sessionStorage.setItem("tfk_active",r.id); S.activeJob=null; topic.value=""; toast("Started. Watch the progress panel."); await pollActive(); startFast(); } else if(r.error!=="demo") toast("Could not start: "+r.error);
  }},"Create new video");
  const file=el("input",{type:"file",accept:"video/mp4,video/quicktime,video/*",id:"vfile"});
  const f={}; const field=(id,label,tag="input",ph="",hint="")=>{ f[id]=el(tag,tag==="input"?{type:"text",placeholder:ph}:{placeholder:ph}); return [el("label",{class:"f"},label),f[id],hint?el("div",{class:"hint"},hint):null]; };
  const plats=Object.keys(PLAT).map(k=>el("label",{class:"chip",style:"cursor:pointer"},el("input",{type:"checkbox",value:k,checked:true}),PLAT[k].n));
  const up=el("button",{class:"btn pri",id:"upBtn",onclick:()=>manualUpload(file,f,plats,up,prog)},"Upload & publish");
  const prog=el("div",{class:"bar hidden",style:"margin-top:10px"},el("i",{style:"width:0"}));
  return el("div",{class:"grid"},
    el("div",{},
      el("section",{class:"kpis",id:"kpis"}),
      el("section",{class:"card"},el("h2",{},"1. Create new video"),el("p",{class:"sub"},"Writes a script, renders the video on Kaggle, then sends it to your Telegram for approval. Progress appears on the right."),el("div",{class:"row"},el("div",{style:"flex:1;min-width:220px"},topic),create)),
      el("section",{class:"card"},el("h2",{},"2. Upload your own video"),el("p",{class:"sub"},"Skips the automation. Publishes a video you made yourself to the platforms you tick. MP4, up to 20 MB, vertical 9:16 works best."),
        file,...field("title","Title *","input","Short, specific title"),...field("caption","Caption","textarea","What viewers should know"),...field("hashtags","Hashtags","input","#fun #science #kids","Separate with spaces or commas."),
        el("details",{style:"margin-top:8px"},el("summary",{},"YouTube-specific text (optional)"),...field("yt_title","YouTube title","input","Defaults to the title"),...field("yt_description","YouTube description","textarea","Defaults to the caption")),
        el("h3",{},"Publish to"),el("div",{class:"chips"},plats),el("div",{class:"row",style:"margin-top:14px"},up),prog),
      el("section",{class:"card",id:"insightsCard"}),
      el("section",{class:"card",id:"videosCard"}),
      el("section",{class:"card",id:"infoCard"})),
    el("aside",{class:"side"},el("section",{class:"card",id:"progressCard"})));
}
async function manualUpload(file,f,plats,btn,prog){
  const title=f.title.value.trim(); const fl=file.files[0];
  if(!fl) return toast("Choose a video file first"); if(!title) return toast("Please enter a title");
  if(fl.size>20*1048576) return toast("That file is "+(fl.size/1048576).toFixed(1)+" MB. The limit is 20 MB; compress it first.");
  const platforms=plats.map(l=>l.firstChild).filter(i=>i.checked).map(i=>i.value); if(!platforms.length) return toast("Tick at least one platform");
  if(!confirm("Publish “"+title+"” to "+platforms.map(p=>PLAT[p].n).join(", ")+" now?")) return;
  btn.disabled=true; btn.textContent="Uploading…"; prog.classList.remove("hidden"); const bar=prog.firstChild;
  try{
    const c=await post("/api/manual",{title,caption:f.caption.value,hashtags:f.hashtags.value,yt_title:f.yt_title.value,yt_description:f.yt_description.value});
    if(!c.ok) throw new Error(c.error||"could not create");
    S.active=c.id; sessionStorage.setItem("tfk_active",c.id); S.activeJob=null;
    let body=fl; btn.textContent="Preparing…"; try{ body=await webOptimize(fl); if(body!==fl) toast("Prepared the file so Instagram can read it."); }catch{ body=fl; } btn.textContent="Uploading…";
    await new Promise((res,rej)=>{ const x=new XMLHttpRequest(); x.open("PUT",S.api+"/api/manual/"+c.id+"/video"); x.setRequestHeader("Authorization","Bearer "+S.token);
      x.upload.onprogress=e=>{ if(e.lengthComputable) bar.style.width=(e.loaded/e.total*100)+"%"; };
      x.onload=()=>{ let j={}; try{j=JSON.parse(x.responseText)}catch{} x.status<300?res():rej(new Error(j.error||"upload failed ("+x.status+")")); }; x.onerror=()=>rej(new Error("network error")); x.send(body); });
    btn.textContent="Publishing…"; toast("Uploaded. Publishing now…"); startFast();
    const p=await post("/api/manual/"+c.id+"/publish",{platforms}); if(!p.ok) throw new Error(p.error||"publish failed");
    toast("Publishing finished. See the progress panel for each platform."); file.value=""; for(const k of ["title","caption","hashtags","yt_title","yt_description"]) f[k].value="";
  }catch(e){ toast("Upload problem: "+e.message); }
  btn.disabled=false; btn.textContent="Upload & publish"; prog.classList.add("hidden"); bar.style.width="0"; await refresh(true);
}
/* Moves the "moov" (index) box in front of the video data when it is at the end, so Instagram and other fetchers can read the file. No re-encoding. */
async function webOptimize(file){
  const buf=new Uint8Array(await file.arrayBuffer()), dv=new DataView(buf.buffer), tag=(o)=>String.fromCharCode(buf[o],buf[o+1],buf[o+2],buf[o+3]);
  const boxes=[]; for(let o=0;o<buf.length;){
    if(o+8>buf.length) return file; let size=dv.getUint32(o), hdr=8;
    if(size===1){ if(o+16>buf.length) return file; size=Number(dv.getBigUint64(o+8)); hdr=16; } else if(size===0) size=buf.length-o;
    if(size<hdr||o+size>buf.length) return file; boxes.push({t:tag(o+4),o,size,hdr}); o+=size;
  }
  const mi=boxes.findIndex(b=>b.t==="moov"), di=boxes.findIndex(b=>b.t==="mdat"), fi=boxes.findIndex(b=>b.t==="ftyp");
  if(mi<0||di<0||fi<0||mi<di) return file; // already web-optimized (or not a plain MP4/MOV)
  const mv=boxes[mi], moov=buf.slice(mv.o,mv.o+mv.size), mdv=new DataView(moov.buffer), shift=mv.size;
  let patched=0;
  const walk=(start,end)=>{ for(let o=start;o+8<=end;){
    const size=mdv.getUint32(o); if(size<8||o+size>end) return; const t=String.fromCharCode(moov[o+4],moov[o+5],moov[o+6],moov[o+7]);
    if(["trak","mdia","minf","stbl","edts"].includes(t)) walk(o+8,o+size);
    else if(t==="stco"){ const n=mdv.getUint32(o+12); for(let i=0;i<n;i++){ const p=o+16+i*4; mdv.setUint32(p,mdv.getUint32(p)+shift); patched++; } }
    else if(t==="co64"){ const n=mdv.getUint32(o+12); for(let i=0;i<n;i++){ const p=o+16+i*8; mdv.setBigUint64(p,mdv.getBigUint64(p)+BigInt(shift)); patched++; } }
    o+=size; } };
  walk(8,moov.length); if(!patched) return file;
  const parts=[]; boxes.forEach((b,i)=>{ if(i===mi) return; parts.push(buf.subarray(b.o,b.o+b.size)); if(i===fi) parts.push(moov); });
  return new Blob(parts,{type:file.type||"video/mp4"});
}

      const r=await post("/api/config",{values:{JOB_TOKEN:a.value}}); if(r.ok){ const nt=a.value; a.value=b.value=""; toast("Token saved. Switching over (up to a minute)…"); let okNew=false; for(let i=0;i<20&&!okNew;i++){ await new Promise(z=>setTimeout(z,i?5000:1500)); try{ const t=await fetch(S.api+"/api/state",{headers:{Authorization:"Bearer "+nt}}); okNew=t.ok; }catch{} }

    el("p",{class:"hint"},"If you ever lock yourself out, a developer can clear all dashboard-saved values with: npx wrangler kv key delete cfg --binding KV --remote"));
}
async function saveCfg(values){ const r=await post("/api/config",{values}); if(r.ok){ toast("Saved. Active within about a minute."+(r.webhook?" Telegram webhook updated.":"")); if(r.items){ S.cfg={items:r.items}; drawCfg(); } refresh(true); } else if(r.error!=="demo") toast(r.error||"Could not save"); }

/* ---------- boot ---------- */
render();
setInterval(()=>{ if(!document.hidden&&(S.token||DEMO)&&S.page!=="settings") refresh(true); },180000);
